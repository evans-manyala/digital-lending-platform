# lms-service/src/main/resources/application.properties
server.port=8080
spring.application.name=lms-service

# H2 Database Config
spring.datasource.url=jdbc:h2:mem:lmsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# CBS SOAP Config
cbs.soap.username=admin
cbs.soap.password=pwd123
cbs.kyc.endpoint=https://kycapitest.credable.io/service/customer
cbs.transaction.endpoint=https://trxapitest.credable.io/service/transaction

# Scoring Engine Config
scoring.api.base-url=https://scoringtest.credable.io/api/v1
scoring.retry.max-attempts=3
scoring.retry.backoff-delay=2000